<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Название страницы</title>

    <!-- Подключение CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Подключение JS Bootstrap (если нужны динамические штуки, типа выпадающего меню) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Навигация</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Домашняя страница</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Связь</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Список
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Опрос</a></li>
                        <li><a class="dropdown-item" href="#">Фитбек</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#">Пройденные опросы</a></li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a class="nav-link disabled" aria-disabled="true">Текущие опросы</a>
                </li>
            </ul>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Поиск" aria-label="Search">
                <button class="btn btn-outline-success" type="submit">Поиск</button>
            </form>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <h2>Опрос: Ваше мнение важно для нас!</h2>
    <form action="/results" method="post">
        <div>
            <h3>Как вам наше приложение?</h3>
            <label>
                <input type="radio" name="feedbackApp" value="Отлично"> Отлично
            </label><br>
            <label>
                <input type="radio" name="feedbackApp" value="Хорошо"> Хорошо
            </label><br>
            <label>
                <input type="radio" name="feedbackApp" value="Плохо"> Плохо
            </label><br><br>
        </div>
        <div>
            <h3>Удобно ли его использовать?</h3>
            <label>
                <input type="radio" name="feedbackUsage" value="Удобно"> Удобно
            </label><br>
            <label>
                <input type="radio" name="feedbackUsage" value="Средне"> Средне
            </label><br>
            <label>
                <input type="radio" name="feedbackUsage" value="Неудобно"> Неудобно
            </label><br><br>
        </div>
        <div>
            <h3>Хотите что-нибудь добавить?</h3><br>
            <label>
                <textarea id="feedback" name="additionalFeedback" rows="4" cols="50"></textarea><br><br>
            </label>
        </div>
        <button type="submit" class="btn btn-success">Отправить</button>
    </form>
</div>
</html>
